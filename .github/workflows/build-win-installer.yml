name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version tag to release (leave empty for a test build)"
        required: false
        type: string
      skip_signing:
        description: "Skip SignPath and publish an explicitly unsigned installer"
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ github.token }}
          persist-credentials: true
          fetch-depth: 0

      - name: Validate release tag and select signing policy
        id: signing
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $releaseTag = ([string]$env:RELEASE_TAG).Trim()

          if (-not $releaseTag) {
            "signing_policy=test-signing" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "publish_release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "No release tag supplied. Building a test installer."
            exit 0
          }

          if ($env:GITHUB_REF -ne "refs/heads/main") {
            throw "Installer releases must be dispatched from the main branch."
          }
          $versionPattern = '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$'
          if ($releaseTag -notmatch $versionPattern) {
            throw "Release tag must be a numeric version such as 1.2.3: $releaseTag"
          }

          git show-ref --verify --quiet "refs/tags/$releaseTag"
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag does not exist: $releaseTag"
          }

          $tagCommit = (git rev-parse "refs/tags/$releaseTag^{commit}").Trim()
          $workflowCommit = (git rev-parse "$env:GITHUB_SHA^{commit}").Trim()
          if ($tagCommit -ne $workflowCommit) {
            throw "Release tag $releaseTag points to $tagCommit, but main was dispatched at $workflowCommit."
          }

          $versionTags = @(git tag --list | Where-Object { $_ -match $versionPattern })
          $latestTag = $versionTags | Sort-Object { [version]$_ } -Descending | Select-Object -First 1
          if ($releaseTag -ne $latestTag) {
            throw "Release tag $releaseTag is not the latest numeric version; expected $latestTag."
          }

          "signing_policy=release-signing" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "publish_release=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Tag $releaseTag matches main at $workflowCommit. Building a release installer."

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.21"

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: ~\go\pkg\mod
          key: ${{ runner.os }}-go-${{ hashFiles('packaging/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install Inno Setup
        run: |
          choco install innosetup -y
        shell: pwsh

      - name: Build installer
        id: build-installer
        env:
          RELEASE_TAG: ${{ steps.signing.outputs.release_tag }}
          APP_VERSION: ${{ steps.signing.outputs.release_tag }}
        run: |
          powershell -ExecutionPolicy Bypass -File packaging/build.ps1

          $installers = @(Get-ChildItem packaging/dist/beratools-installer-*.exe -File)
          if ($installers.Count -ne 1) {
            throw "Expected one unsigned installer, found $($installers.Count)."
          }

          if ($installers[0].BaseName -notmatch '^beratools-installer-(\d+\.\d+\.\d+(?:\.\d+)?)$') {
            throw "Installer filename does not contain a supported version: $($installers[0].Name)"
          }

          $version = $Matches[1]
          if ($env:RELEASE_TAG -and $version -ne $env:RELEASE_TAG) {
            throw "Built installer version $version does not match release tag $env:RELEASE_TAG."
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        shell: pwsh
        working-directory: ${{ github.workspace }}

      - name: Label unsigned installer
        if: inputs.skip_signing
        shell: pwsh
        env:
          INSTALLER_VERSION: ${{ steps.build-installer.outputs.version }}
        run: |
          Move-Item -LiteralPath "packaging/dist/beratools-installer-$env:INSTALLER_VERSION.exe" `
            -Destination "packaging/dist/beratools-installer-$env:INSTALLER_VERSION-unsigned.exe"

      - name: Upload unsigned installer artifact
        id: upload-unsigned-installer
        uses: actions/upload-artifact@v7
        with:
          name: beratools-installer-unsigned
          path: packaging/dist/beratools-installer-*.exe
          if-no-files-found: error

      - name: Submit installer to SignPath
        if: ${{ !inputs.skip_signing }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: beratools
          signing-policy-slug: ${{ steps.signing.outputs.signing_policy }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(steps.build-installer.outputs.version) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: packaging/dist-signed

      - name: Verify signed installer
        if: ${{ !inputs.skip_signing }}
        shell: pwsh
        env:
          SIGNING_POLICY: ${{ steps.signing.outputs.signing_policy }}
        run: |
          $installers = @(Get-ChildItem packaging/dist-signed/beratools-installer-*.exe -File)
          if ($installers.Count -ne 1) {
            throw "Expected one signed installer, found $($installers.Count)."
          }

          $installer = $installers[0]
          $sig = Get-AuthenticodeSignature $installer.FullName
          $sig | Format-List
          if ($null -eq $sig.SignerCertificate -or $sig.Status -eq "NotSigned") {
            throw "Installer was not signed."
          }

          if ($env:SIGNING_POLICY -eq "release-signing" -and $sig.Status -ne "Valid") {
            throw "Release signature is not valid: $($sig.Status) - $($sig.StatusMessage)"
          }

      - name: Upload signed installer artifact
        if: ${{ !inputs.skip_signing }}
        uses: actions/upload-artifact@v7
        with:
          name: beratools-installer-signed
          path: packaging/dist-signed/beratools-installer-*.exe
          if-no-files-found: error

      - name: Upload signed installer to release
        if: steps.signing.outputs.publish_release == 'true' && !inputs.skip_signing
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.signing.outputs.release_tag }}
          files: packaging/dist-signed/beratools-installer-*.exe
          overwrite_files: false
          body: |
            Windows installer signed under the [BERA Tools Code signing policy](https://github.com/BERATool/beratools/blob/main/CODE_SIGNING_POLICY.md).
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload unsigned installer to release
        if: steps.signing.outputs.publish_release == 'true' && inputs.skip_signing
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.signing.outputs.release_tag }}
          files: packaging/dist/beratools-installer-*-unsigned.exe
          overwrite_files: false
          body: |
            **Unsigned Windows installer:** SignPath was explicitly skipped for this build. The `-unsigned.exe` asset has no Authenticode signature; Windows may display an unknown-publisher or SmartScreen warning. See the [Code signing policy](https://github.com/BERATool/beratools/blob/main/CODE_SIGNING_POLICY.md).
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
