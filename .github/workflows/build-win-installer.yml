name: Build Windows Installer

run-name: Windows installer ${{ inputs.release_tag || 'test build' }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version tag to release (leave empty for a test build)"
        required: false
        type: string
      skip_signing:
        description: "Skip SignPath and publish an explicitly unsigned installer"
        required: false
        type: boolean
        default: true

concurrency:
  group: installer-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Validate publishing source
        id: source
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="$INPUT_RELEASE_TAG"
          source_sha="$(git rev-parse HEAD)"
          publish=false
          mode=dry-run
          if [[ -n "$tag" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Publishing must be dispatched from main." >&2; exit 1; }
            [[ "$tag" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "Release tag must be a numeric version such as 1.2.3." >&2; exit 1; }
            git merge-base --is-ancestor "$source_sha" "$GITHUB_SHA" || { echo "Tag must belong to the dispatched main commit's history." >&2; exit 1; }
            publish=true
            mode=release
          else
            [[ "$source_sha" == "$GITHUB_SHA" ]] || { echo "Dry run must build the triggering commit." >&2; exit 1; }
          fi
          printf 'release_tag=%s\npublish=%s\n' "$tag" "$publish" >> "$GITHUB_OUTPUT"
          printf '### Publishing source\n\n- Mode: `%s`\n- Tag: `%s`\n- Source commit: `%s`\n- Workflow commit: `%s`\n' \
            "$mode" "${tag:-none}" "$source_sha" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.21"

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: ~\go\pkg\mod
          key: ${{ runner.os }}-go-${{ hashFiles('packaging/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install Inno Setup
        run: |
          choco install innosetup -y
        shell: pwsh

      - name: Build installer
        id: build-installer
        env:
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
          APP_VERSION: ${{ steps.source.outputs.release_tag }}
        run: |
          powershell -ExecutionPolicy Bypass -File packaging/build.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Installer build failed with exit code $LASTEXITCODE."
          }

          $installers = @(Get-ChildItem packaging/dist/beratools-installer-*.exe -File)
          if ($installers.Count -ne 1) {
            throw "Expected one unsigned installer, found $($installers.Count)."
          }

          if ($installers[0].BaseName -notmatch '^beratools-installer-(\d+\.\d+\.\d+(?:\.\d+)?)$') {
            throw "Installer filename does not contain a supported version: $($installers[0].Name)"
          }

          $version = $Matches[1]
          if ($env:RELEASE_TAG -and $version -ne $env:RELEASE_TAG) {
            throw "Built installer version $version does not match release tag $env:RELEASE_TAG."
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        shell: pwsh
        working-directory: ${{ github.workspace }}

      - name: Label unsigned installer
        if: inputs.skip_signing
        shell: pwsh
        env:
          INSTALLER_VERSION: ${{ steps.build-installer.outputs.version }}
        run: |
          Move-Item -LiteralPath "packaging/dist/beratools-installer-$env:INSTALLER_VERSION.exe" `
            -Destination "packaging/dist/beratools-installer-$env:INSTALLER_VERSION-unsigned.exe"

      - name: Upload unsigned installer artifact
        id: upload-unsigned-installer
        uses: actions/upload-artifact@v7
        with:
          name: beratools-installer-unsigned
          path: packaging/dist/beratools-installer-*.exe
          if-no-files-found: error

      - name: Submit installer to SignPath
        if: ${{ !inputs.skip_signing }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: beratools
          signing-policy-slug: ${{ steps.source.outputs.publish == 'true' && 'release-signing' || 'test-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(steps.build-installer.outputs.version) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: packaging/dist-signed

      - name: Verify signed installer
        if: ${{ !inputs.skip_signing }}
        shell: pwsh
        env:
          SIGNING_POLICY: ${{ steps.source.outputs.publish == 'true' && 'release-signing' || 'test-signing' }}
        run: |
          $installers = @(Get-ChildItem packaging/dist-signed/beratools-installer-*.exe -File)
          if ($installers.Count -ne 1) {
            throw "Expected one signed installer, found $($installers.Count)."
          }

          $installer = $installers[0]
          $sig = Get-AuthenticodeSignature $installer.FullName
          $sig | Format-List
          if ($null -eq $sig.SignerCertificate -or $sig.Status -eq "NotSigned") {
            throw "Installer was not signed."
          }

          if ($env:SIGNING_POLICY -eq "release-signing" -and $sig.Status -ne "Valid") {
            throw "Release signature is not valid: $($sig.Status) - $($sig.StatusMessage)"
          }

      - name: Upload signed installer artifact
        if: ${{ !inputs.skip_signing }}
        uses: actions/upload-artifact@v7
        with:
          name: beratools-installer-signed
          path: packaging/dist-signed/beratools-installer-*.exe
          if-no-files-found: error

      - name: Upload signed installer to release
        if: steps.source.outputs.publish == 'true' && !inputs.skip_signing
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.source.outputs.release_tag }}
          files: packaging/dist-signed/beratools-installer-*.exe
          overwrite_files: false
          body: |
            Windows installer signed under the [BERA Tools Code signing policy](https://github.com/BERATool/beratools/blob/main/CODE_SIGNING_POLICY.md).
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload unsigned installer to release
        if: steps.source.outputs.publish == 'true' && inputs.skip_signing
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.source.outputs.release_tag }}
          files: packaging/dist/beratools-installer-*-unsigned.exe
          overwrite_files: false
          body: |
            **Unsigned Windows installer:** SignPath was explicitly skipped for this build. The `-unsigned.exe` asset has no Authenticode signature; Windows may display an unknown-publisher or SmartScreen warning. See the [Code signing policy](https://github.com/BERATool/beratools/blob/main/CODE_SIGNING_POLICY.md).
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
