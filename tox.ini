[tox]
envlist = py312,py313,py314
requires = 
    tox>=4.0
    tox-uv
skipsdist = False

[testenv]
description = Run tests/test_workflow.py with pytest in an isolated environment
package = skip
skip_install = true
sitepackages = true
# Run pytest via the env's interpreter: with sitepackages=true pytest lives in the
# base (conda) env, so a bare `pytest` is not inside the venv and tox 4 rejects it.
commands =
     python -m pytest -vv -s --maxfail=1 --log-cli-level=INFO tests/test_workflow.py
setenv =
    PYTHONDONTWRITEBYTECODE = 1
# tox 4 strips the environment. Inside the venv sys.prefix is .tox/<env>, so
# pyproj/pyogrio/GDAL cannot locate the base env's data files on their own and
# need the variables the conda activation scripts set.
passenv =
    PROJ_DATA
    PROJ_LIB
    GDAL_DATA
    GDAL_DRIVER_PATH

[testenv:py312]
basepython = python3.12

[testenv:py313]
basepython = python3.13

[testenv:py314]
basepython = python3.14
