name: Publish to PyPI

run-name: PyPI ${{ inputs.release_tag || 'dry run' }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version tag to publish (leave empty for dry run)"
        required: false
        type: string

concurrency:
  group: pypi-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate publishing source
        id: source
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="$INPUT_RELEASE_TAG"
          source_sha="$(git rev-parse HEAD)"
          publish=false
          mode=dry-run
          if [[ -n "$tag" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Publishing must be dispatched from main." >&2; exit 1; }
            [[ "$tag" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "Release tag must be a numeric version such as 1.2.3." >&2; exit 1; }
            git merge-base --is-ancestor "$source_sha" "$GITHUB_SHA" || { echo "Tag must belong to the dispatched main commit's history." >&2; exit 1; }
            publish=true
            mode=release
          else
            [[ "$source_sha" == "$GITHUB_SHA" ]] || { echo "Dry run must build the triggering commit." >&2; exit 1; }
          fi
          printf 'release_tag=%s\npublish=%s\n' "$tag" "$publish" >> "$GITHUB_OUTPUT"
          printf '### Publishing source\n\n- Mode: `%s`\n- Tag: `%s`\n- Source commit: `%s`\n- Workflow commit: `%s`\n' \
            "$mode" "${tag:-none}" "$source_sha" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Set release version
        if: steps.source.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
        run: echo "SETUPTOOLS_SCM_PRETEND_VERSION=$RELEASE_TAG" >> "$GITHUB_ENV"
      - name: Install build tools
        run: pip install build twine hatch-vcs
      - name: Build package
        run: python -m build
      - name: Check package metadata
        run: python -m twine check --strict dist/*
      - name: Verify release package version
        if: steps.source.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from packaging.utils import parse_sdist_filename, parse_wheel_filename
          from packaging.version import Version

          expected = Version(os.environ["RELEASE_TAG"])
          for pattern, parse in (("*.whl", parse_wheel_filename), ("*.tar.gz", parse_sdist_filename)):
              files = list(Path("dist").glob(pattern))
              assert len(files) == 1, f"Expected one {pattern} package, found {files}"
              assert parse(files[0].name)[1] == expected, f"Package version does not match {expected}: {files[0]}"
          PY
      - name: Publish to PyPI
        if: steps.source.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Upload dry-run packages
        if: always() && steps.source.outputs.publish == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: beratools-pypi-dry-run
          path: dist/*
          if-no-files-found: warn
