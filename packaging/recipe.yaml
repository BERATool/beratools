schema_version: 1

context:
  name: BERATools
  version: ${{ env.get("VERSION") }}

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  path: ..
  use_gitignore: true

build:
  number: 0
  noarch: python
  script: SETUPTOOLS_SCM_PRETEND_VERSION=${{ version }} python -m pip install . -vv --no-deps
  python:
    entry_points:
      - bt = beratools.cli.entry:run
      - beratools = beratools.cli.entry:run

requirements:
  host:
    - python >=3.12,<3.15
    - hatchling
    - pip
    - hatch-vcs
    - git
  run:
    - python >=3.12,<3.15
    - dask
    - gdal >=3.12,<4
    - geopandas
    - pandas
    - networkit
    - numpy >=1.26,<2.4
    - pyarrow
    - pyogrio >=0.12.0
    - pyqt
    - rasterio >=1.5.0
    - scikit-image >=0.24.0
    - tabulate
    - tqdm
    - xarray-spatial
    - python-igraph
    - psutil
tests:
  - script:
      - pytest tests/test_workflow.py
    
    files:
      source:
        - tests/

    requirements:
      run:
        - pytest

  - python:
      imports:
        - beratools
        - igraph

about:
  summary: An advanced forest line feature analysis platform
  license: GPL-3.0-or-later
  license_file:
    - LICENSE
  homepage: https://github.com/BERATool/beratools.git

extra:
  recipe-maintainers:
    - richard
